# Push a tag such as v0.2.0. This builds the desktop app, makes a GitHub release with the zips
# (install.sh downloads them) and publishes the npm package (npx claude-dash).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Take the version from the tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version -w cli -w desktop
      - run: npm run build -w web
      - name: Build the desktop app (arm64 and x64 zips)
        run: npm run build -w desktop
      - name: Create the GitHub release
        run: gh release create "$GITHUB_REF_NAME" desktop/release/*.zip --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish to npm
        run: |
          npm run build -w cli
          npm publish -w cli --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
